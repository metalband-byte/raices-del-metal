<style>
:root{--bg:#030303;--fg:#f1f1f1;--mut:#aaaaaa;--line:#1f1f1f;--line2:#303030;--g:#8b6cff;--hit:#6fd0e8;--card:#121212;--card2:#1e1e1e;--glow:rgba(139,108,255,.13);--sh:0 10px 30px rgba(0,0,0,.7);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#f3f2fb;--fg:#1a1833;--mut:#66648a;--line:#dcdaf0;--line2:#c6c3e6;--g:#5a3fd8;--hit:#0b7a96;--card:#ebe9f9;--card2:#e2dff5;--glow:rgba(90,63,216,.14);--sh:0 8px 22px rgba(40,30,90,.18);color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f2fb;--fg:#1a1833;--mut:#66648a;--line:#dcdaf0;--line2:#c6c3e6;--g:#5a3fd8;--hit:#0b7a96;--card:#ebe9f9;--card2:#e2dff5;--glow:rgba(90,63,216,.14);--sh:0 8px 22px rgba(40,30,90,.18);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--g);color:var(--bg)}
html{scroll-padding-top:150px}
body{margin:0;background:radial-gradient(900px 380px at 50% -140px,var(--glow),transparent 70%) no-repeat,var(--bg);color:var(--fg);font:400 17px/1.4 'Barlow Condensed','Arial Narrow',sans-serif;padding-bottom:calc(220px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 10px;font:400 31px/1 'Pirata One',Georgia,serif;letter-spacing:.8px;color:var(--g);background:linear-gradient(180deg,#f3d27a,var(--g) 60%,#a8741a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
:root[data-theme="light"] h1{background:none;-webkit-text-fill-color:currentColor}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) h1{background:none;-webkit-text-fill-color:currentColor}}
input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:18px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mut)}
input:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px var(--glow)}
button:focus-visible{outline:2px solid var(--hit);outline-offset:1px}
button{transition:background .15s,border-color .15s,color .15s,transform .1s}
button:active{transform:scale(.97)}
.bar{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.bar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:5px 13px;font:inherit;cursor:pointer}
.bar button:hover{border-color:var(--g)}
main{padding:10px 8px 0}
ul{list-style:none;margin:0;padding:0}
ul ul{margin-left:13px;padding-left:10px;border-left:2px solid var(--line2)}
.row{display:flex;align-items:center;gap:6px;min-height:40px;position:relative;border-radius:8px;transition:background .15s}
.row:hover{background:var(--card)}
ul ul .row::before{content:"";width:10px;border-top:2px solid var(--line2);position:absolute;left:-12px}
.tg{width:28px;height:28px;flex:none;border:1px solid var(--line2);background:var(--card2);color:var(--g);border-radius:50%;cursor:pointer;font-size:13px;padding:0}
.tg:hover{border-color:var(--g);background:var(--g);color:var(--bg)}
.dot{width:8px;height:8px;margin:0 10px;flex:none;border-radius:50%;background:var(--line2)}
.nm{background:none;border:0;color:var(--fg);font:inherit;font-size:19px;text-align:left;padding:6px 2px;cursor:pointer}
.nm:hover{color:var(--g)}
.g>.nm{color:var(--g);font-weight:600}
.yr,.ct{color:var(--mut);font-size:14px}
.sel{background:linear-gradient(90deg,var(--glow),transparent)}
.sel>.nm{text-decoration:underline;text-decoration-color:var(--g);text-underline-offset:4px}
mark{background:none;color:var(--hit);font-weight:600}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--g);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:46%;overflow:auto;z-index:6}
#sheet h2{margin:0;font:400 26px/1.1 'Pirata One',Georgia,serif;color:var(--g)}
#sheet p{margin:6px 0 0}
.meta{color:var(--mut);font-size:15px}
.lin{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.lin button{border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:3px 10px;font:inherit;font-size:15px;cursor:pointer}
.lin button:hover{border-color:var(--g)}
.empty{padding:20px 6px;color:var(--mut)}
[hidden]{display:none!important}
body.l{padding-bottom:0}
.tabs{display:flex;gap:4px;margin:0 0 4px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tabs button{flex:1;padding:8px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:15px;border-radius:9px;cursor:pointer}
.tabs button:hover{background:var(--card2);color:var(--fg)}
.tabs .on,.tabs .on:hover{background:var(--g);color:var(--bg);font-weight:600;box-shadow:0 2px 10px var(--glow)}
#lab{padding:12px 12px calc(30px + env(safe-area-inset-bottom,0px))}
.lc{border-top:1px solid var(--line);padding:12px 0}.lc h3{margin:0;font:400 24px/1.1 'Pirata One',Georgia,serif;color:var(--g)}.lc p{margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chips button,.chips span{border:1px solid var(--line2);background:var(--card2);color:var(--mut);border-radius:14px;padding:3px 11px;font:inherit;font-size:15px}
.chips button{color:var(--fg);cursor:pointer;border-color:var(--line2)}
.chips button:hover{border-color:var(--g);color:var(--g)}
.chips .on,.chips button.on:hover{background:var(--g);color:var(--bg);border-color:var(--g)}
.lc a{color:var(--hit);margin-right:12px;font-size:15px}
.k{color:var(--mut);font-size:14px;margin-top:8px;letter-spacing:.6px;text-transform:uppercase}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips.sc button{flex:none}
#dir{padding:12px 12px calc(30px + env(safe-area-inset-bottom,0px))}#dir .lc .nm{font-family:'Pirata One',Georgia,serif;font-size:24px;color:var(--g);padding:0}
body{padding-bottom:0}
.tr{border-left:2px solid var(--g);padding-left:10px;margin:6px 0}.tr ol{margin:4px 0 6px;padding-left:22px}
.mr{margin:4px 0}.mr button{border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:3px 10px;font:inherit;font-size:15px;cursor:pointer}.mr button:hover{border-color:var(--g);color:var(--g)}

.lc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 0 10px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 4px 14px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s}
.lc:hover{border-color:var(--line2)}
.lk{border:0;background:none;color:var(--hit);font:inherit;cursor:pointer;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.lk:hover{color:var(--g)}
#lab .lc .nm{font-family:'Pirata One',Georgia,serif;font-size:24px;color:var(--g);padding:0}
.hero{padding:2px 2px 10px}.hero p{margin:0;color:var(--mut)}
.cta{border:1px solid var(--g);background:transparent;color:var(--g);border-radius:20px;padding:6px 17px;font:inherit;cursor:pointer;margin:8px 0 2px}
.cta:hover{background:var(--g);color:var(--bg);box-shadow:0 2px 12px var(--glow)}
.chips a{border:1px solid var(--hit);border-radius:14px;padding:3px 11px;color:var(--hit);text-decoration:none;font-size:15px;margin:0;background:transparent}
.chips a:hover{background:var(--hit);color:var(--bg)}
#lrn{padding:12px 12px 30px}.sec{margin:20px 0 8px;font:400 26px/1 'Pirata One',Georgia,serif;color:var(--g);padding-bottom:6px;border-bottom:1px solid var(--line)}
#nx{position:fixed;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--card);border-top:1px solid var(--g);border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 -14px 40px rgba(0,0,0,.65)}
#nx::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 8px}
#nx h2{margin:8px 0 0;font:400 30px/1.1 'Pirata One',Georgia,serif;color:var(--g)}#nx p{margin:6px 0}
.nh{display:flex;justify-content:space-between}.nh button{border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:3px 13px;font:inherit;cursor:pointer}.nh button:hover{border-color:var(--g);color:var(--g)}
.al{padding-left:18px;list-style:disc;margin:6px 0}.al::marker{color:var(--g)}
#lg{position:absolute;top:12px;right:14px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit;font-size:15px;cursor:pointer}#lg:hover{border-color:var(--g)}header h1{padding-right:120px}
#prd{padding:12px 12px 30px}#prd .lc .nm{font-family:'Pirata One',Georgia,serif;font-size:24px;color:var(--g);padding:0}

.cv{margin:8px 0}.cv-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.cv-box img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line2);background:var(--card2);box-shadow:var(--sh)}.cv-m{flex:1;min-width:120px;font-size:15px}.cv-m div{margin:2px 0}.cv .chips{margin:6px 0 2px}.cv [data-st]{min-height:1em}
.tl2{margin:4px 0 8px;padding-left:26px}.tl2 li{margin:2px 0}.tl2 li::marker{color:var(--mut)}.tl2 .meta{margin-left:6px}.cv-bulk{margin:8px 0 4px}.cv-bulk .cta{margin:0}

/* ===== Color por estilo (género) ===== */
[data-g="hr"],[data-nx="g|hr"],[data-fg="hr"]{--a:#ee8a3b}
[data-g="hm"],[data-nx="g|hm"],[data-fg="hm"]{--a:#5bb0e8}
[data-g="pw"],[data-nx="g|pw"],[data-fg="pw"]{--a:#2ec4b6}
[data-g="aor"],[data-nx="g|aor"],[data-fg="aor"]{--a:#ff86b4}
[data-g="gl"],[data-nx="g|gl"],[data-fg="gl"]{--a:#e24fc0}
[data-g="sp"],[data-nx="g|sp"],[data-fg="sp"]{--a:#f4d03f}
[data-g="th"],[data-nx="g|th"],[data-fg="th"]{--a:#ee4b4b}
[data-g="bl"],[data-nx="g|bl"],[data-fg="bl"]{--a:#b7c0cf}
[data-g="vk"],[data-nx="g|vk"],[data-fg="vk"]{--a:#3fb27f}
[data-g="nw"],[data-nx="g|nw"],[data-fg="nw"]{--a:#7d8cff}
[data-g="dm"],[data-nx="g|dm"],[data-fg="dm"]{--a:#9d6bff}
[data-g="dt"],[data-nx="g|dt"],[data-fg="dt"]{--a:#a9c23a}
[data-g="gr"],[data-nx="g|gr"],[data-fg="gr"]{--a:#d9774a}
[data-g="nm"],[data-nx="g|nm"],[data-fg="nm"]{--a:#4fc3d9}
[data-g="gs"],[data-nx="g|gs"],[data-fg="gs"]{--a:#c28ae6}
[data-g],[data-nx^="g|"],[data-fg]{--at:light-dark(color-mix(in srgb,var(--a,var(--g)) 58%,#000),var(--a,var(--g)))}

/* Fichas de banda / estilo: borde y tinte del color del estilo */
.lc[data-g]{border-left:4px solid var(--a,var(--g));background:linear-gradient(120deg,color-mix(in srgb,var(--a,var(--g)) 13%,var(--card)),var(--card) 62%)}

var HS={'Black Sabbath':'Nació en Birmingham con Ozzy Osbourne, Tony Iommi, Geezer Butler y Bill Ward. Su sonido oscuro y pesado sentó las bases del heavy metal, con discos como Paranoid (1970).','Iron Maiden':'Fundada en 1975 por el bajista Steve Harris en Londres. Lideró la NWOBHM y se volvió una de las bandas más influyentes del heavy metal, con la mascota Eddie en sus portadas.','Metallica':'Formada en Los Ángeles en 1981 por James Hetfield y Lars Ulrich. Es una de las cuatro grandes del thrash junto a Slayer, Megadeth y Anthrax, y una de las bandas de metal más vendidas.','Judas Priest':'Nació en Birmingham a fines de los 60. Con Rob Halford en la voz definió el heavy metal clásico, incluida la estética de cuero y tachas.','Motörhead':'Fundada por Lemmy Kilmister en Londres en 1975. Mezcló punk y heavy metal a gran velocidad y fue clave para el thrash y el metal extremo.','Led Zeppelin':'Formada en Londres en 1968 por Jimmy Page. Fue pionera del hard rock y del heavy metal, con discos como Led Zeppelin IV (1971).','Deep Purple':'Formada en Inglaterra en 1968. Junto a Led Zeppelin y Black Sabbath ayudó a dar forma al hard rock y al metal, con temas como Smoke on the Water.','Slayer':'Formada en Huntington Park, California, en 1981. Su disco Reign in Blood (1986) es una referencia del thrash por su velocidad y agresividad.','Megadeth':'Fundada en 1983 por Dave Mustaine tras dejar Metallica. Destaca por su thrash técnico, con discos como Rust in Peace (1990).','Pantera':'Formada en Texas en 1981. A inicios de los 90 desarrolló un metal más pesado y groovero que influyó en toda una generación.','Sepultura':'Formada en Belo Horizonte, Brasil, en 1984 por los hermanos Max e Igor Cavalera. Llevó el metal extremo brasileño al mundo con Beneath the Remains (1989) y Roots (1996).','Mayhem':'Nacida en Noruega en 1984. Fue central en el black metal noruego de los 90, con De Mysteriis Dom Sathanas (1994).','Bathory':'Proyecto del sueco Quorthon, iniciado en 1983. Fue pionero del black metal y más tarde del viking metal.','Venom':'Formada en Newcastle en 1978. Su disco Black Metal (1982) dio nombre a un género e influyó en el thrash y el metal extremo.','Scorpions':'Formada en Hannover, Alemania, a fines de los 60. Combinó hard rock y baladas y logró fama mundial con temas como Wind of Change.','AC/DC':'Formada en Sídney en 1973 por los hermanos Malcolm y Angus Young. Su hard rock directo es un clásico mundial, y Back in Black (1980) está entre los discos más vendidos de la historia.','Helloween':'Formada en Hamburgo en 1984. Con los dos Keeper of the Seven Keys (1987 y 1988) fijó las bases del power metal europeo.','Opeth':'Formada en Estocolmo en 1990. Combina death metal con rock progresivo y pasajes acústicos.','Gojira':'Banda francesa formada en 1996. Mezcla death metal técnico con temas ambientales y un sonido propio.','Rammstein':'Formada en Berlín en 1994. Su estilo mezcla metal industrial, letras en alemán y espectáculos con fuego.','Death':'Fundada por Chuck Schuldiner en Florida en 1983. Es considerada una de las creadoras del death metal y evolucionó hacia un estilo más técnico y progresivo.'};Object.assign(HS,{"Triumvirat": "Trío alemán fundado en Colonia en 1969 en torno al teclista Jürgen Fritz. Su rock sinfónico, cercano al de Emerson, Lake & Palmer, luce en Illusions on a Double Dimple (1974).", "Ange": "Banda francesa de Belfort liderada por los hermanos Christian y Francis Décamps. Une rock progresivo y teatro, con letras en francés; su disco clave es Au-delà du délire (1974).", "Osanna": "Grupo de Nápoles que mezcló rock progresivo, folk y jazz. Su debut L’uomo (1971) y Palepoli (1972) son referencias del progresivo italiano.", "Area": "Grupo milanés de rock progresivo y jazz-rock con un fuerte discurso político. Destaca la voz experimental de Demetrio Stratos, sobre todo en Arbeit macht frei (1973).", "Rare Bird": "Banda londinense de rock progresivo formada en 1969, con órgano y piano en lugar de guitarra. Su tema evolt! (1999) mixed nu metal, industrial and science fiction.", "Rage Against the Machine": "Formed in Los Angeles in 1991. It combined rap, funk and metal with Zack de la Rocha's political lyrics and Tom Morello's guitar style. A key influence on nu metal.", "Soulfly": "Project of Max Cavalera, founded in 1997 after leaving Sepultura. It mixes groove, nu metal and tribal rhythms; Soulfly (1998) and Primitive (2000) are its classics.", "Ill Niño": "Formed in New Jersey in 1998 with Latin roots. It combines nu metal, groove and percussion; Revolution Revolución (2001) was its debut.", "Kittie": "Canadian band from London, Ontario, founded by teenagers in 1996. Its debut Spit (1999) mixed nu metal with extreme vocals.", "Spineshank": "Formed in Los Angeles in 1996. Its industrial nu metal shows on The Height of Callousness (2000), with a Fear Factory influence."});

HS['Arch Enemy']='Formada en Halmstad (Suecia) en 1995 por el guitarrista Michael Amott, tras su paso por Carcass. Su death metal melódico, con las voces de Angela Gossow desde 2000 y de Alissa White-Gluz desde 2014, la llevó a la primera línea del género con discos como Wages of Sin (2001) y War Eternal (2014).';HE['Arch Enemy']='Formed in Halmstad, Sweden, in 1995 by guitarist Michael Amott after his time in Carcass. Their melodic death metal, fronted by Angela Gossow from 2000 and Alissa White-Gluz from 2014, took them to the top tier of the genre with albums like Wages of Sin (2001) and War Eternal (2014).';
HS['Epica']='Fundada en 2002 en los Países Bajos por Mark Jansen tras dejar After Forever. Combina la voz de mezzosoprano de Simone Simons con guturales, coros y orquesta; su nombre viene del disco homónimo de Kamelot.';HE['Epica']='Founded in 2002 in the Netherlands by Mark Jansen after leaving After Forever. It combines Simone Simons’ mezzo-soprano with growls, choirs and orchestra; the name comes from Kamelot’s album of the same name.';
HS['D.R.I.']='Dirty Rotten Imbeciles nació en Houston en 1982 y fue de las primeras bandas en fundir el hardcore punk con el thrash metal. Su disco Crossover (1987) se asocia al nombre del género y marcó a bandas como Suicidal Tendencies y Municipal Waste.';HE['D.R.I.']='Dirty Rotten Imbeciles formed in Houston in 1982 and were among the first bands to fuse hardcore punk with thrash metal. Their album Crossover (1987) is linked to the genre’s name and influenced bands like Suicidal Tendencies and Municipal Waste.';
HS['Suicidal Tendencies']='Formada en 1980 en Los Ángeles por Mike Muir. Su debut de 1983 es un clásico del hardcore californiano y, con How Will I Laugh Tomorrow (1988), se acercó al thrash y al metal con funk, sin perder la actitud callejera.';HE['Suicidal Tendencies']='Formed in Los Angeles in 1980 by Mike Muir. Their 1983 debut is a classic of Californian hardcore and, with How Will I Laugh Tomorrow (1988), they moved toward thrash and metal with funk, keeping their street attitude.';
HS['Stormtroopers of Death (S.O.D.)']='Proyecto paralelo nacido en Nueva York en 1985 con Scott Ian y Charlie Benante (Anthrax), Dan Lilker y Billy Milano. Speak English or Die (1985) reúne decenas de canciones cortísimas y humor negro, y es una pieza clave del crossover.';HE['Stormtroopers of Death (S.O.D.)']='Side project born in New York in 1985 with Scott Ian and Charlie Benante (Anthrax), Dan Lilker and Billy Milano. Speak English or Die (1985) packs dozens of very short songs and dark humor, and is a key crossover record.';
HS['Ratos de Porão']='Pilar del punk hardcore y el crossover brasileños, formado en São Paulo en 1981 con João Gordo en la voz. Con discos como Brasil (1989) y Anarkophobia (1991) cruzó el punk con el thrash y tuvo gran influencia en la escena latinoamericana.';HE['Ratos de Porão']='A pillar of Brazilian hardcore punk and crossover, formed in São Paulo in 1981 with João Gordo on vocals. With albums like Brasil (1989) and Anarkophobia (1991) they mixed punk with thrash and were hugely influential in the Latin American scene.';
HS['Therion']='Banda sueca nacida en 1987 que pasó del death metal a un metal sinfónico con coros líricos y orquesta. Theli (1996) es su disco más influyente y abrió el camino a gran parte del metal sinfónico europeo.';HE['Therion']='Swedish band formed in 1987 that moved from death metal to symphonic metal with operatic choirs and orchestra. Theli (1996) is their most influential album and opened the way for much of European symphonic metal.';
CC['Austria']='AT';CC['Ucrania']='UA';
HS['Rob Rock']='Cantante estadounidense de Orlando, conocido como “la voz del metal melódico”. Pasó por M.A.R.S., Joshua, Driver e Impellitteri, y desde 2000 edita discos propios, como Rage of Creation y Holy Hell.';
HS['M.A.R.S.']='Supergrupo de Los Ángeles formado en 1986 por Tony MacAlpine, Tommy Aldridge, Rob Rock y Rudy Sarzo; su nombre sale de las iniciales de sus apellidos. Editó un único disco, Project: Driver (Shrapnel, 1986).';
HS['Vitalij Kuprij']='Tecladista y pianista ucraniano (1974-2024), formado en el conservatorio y figura del metal neoclásico y progresivo. Tocó en Artension y Ring of Fire, editó discos solistas desde High Definition (1997) y fue parte de Trans-Siberian Orchestra.';
HS['X Japan']='Banda japonesa fundada en 1982 por el baterista y pianista Yoshiki y el cantante Toshi. Mezcló speed metal con baladas sinfónicas y fue la gran referencia del visual kei, con discos como Blue Blood (1989) y Dahlia (1996).';
if(typeof HE==='object'&&HE)Object.assign(HE,{'Rob Rock':'American singer from Orlando, known as “the voice of melodic metal”. He sang with M.A.R.S., Joshua, Driver and Impellitteri, and has released his own albums since 2000, such as Rage of Creation and Holy Hell.','M.A.R.S.':'Los Angeles supergroup formed in 1986 by Tony MacAlpine, Tommy Aldridge, Rob Rock and Rudy Sarzo; the name comes from the initials of their surnames. They released a single album, Project: Driver (Shrapnel, 1986).','Vitalij Kuprij':'Ukrainian keyboardist and pianist (1974–2024), conservatory-trained and a key figure of neoclassical and progressive metal. He played in Artension and Ring of Fire, released solo albums from High Definition (1997) and was part of Trans-Siberian Orchestra.','X Japan':'Japanese band founded in 1982 by drummer and pianist Yoshiki and singer Toshi. They blended speed metal with symphonic ballads and were the great reference of visual kei, with albums such as Blue Blood (1989) and Dahlia (1996).'});
GD.cx='Mezcla de hardcore punk y thrash metal surgida en los años 80: canciones cortas, rápidas y agresivas que unieron dos públicos antes separados. D.R.I., Suicidal Tendencies y S.O.D. son sus referentes.';GE.cx='A mix of hardcore punk and thrash metal that emerged in the 80s: short, fast, aggressive songs that brought together two audiences that used to be separate. D.R.I., Suicidal Tendencies and S.O.D. are its reference bands.';
GD.hc='Variante más rápida y cruda del punk, nacida a comienzos de los 80 en EE.UU. Influyó de forma decisiva en el thrash y en el crossover.';GE.hc='A faster, rawer form of punk that emerged in the early 80s in the US. It was a decisive influence on thrash and crossover.';
GD.fk='Metal que mezcla instrumentos tradicionales (violín, flauta, gaita) con guitarras pesadas y letras de mitología y folclore.';GE.fk='Metal that blends traditional instruments (fiddle, flute, bagpipes) with heavy guitars and lyrics about mythology and folklore.';CC['Islas Feroe']='FO';CC['Bélgica']='BE';
GD.pr='Rock de estructuras largas y ambiciosas: suites, teclados, cambios de compás y conceptos literarios. Toma forma en el Reino Unido hacia 1968 con King Crimson y Yes.';
GE.pr='Rock built on long, ambitious structures: suites, keyboards, shifting time signatures and literary concepts. It took shape in Britain around 1968 with King Crimson and Yes.';
GD.pg='Metal de composiciones largas y técnicas, con cambios de compás y a menudo teclados: une la potencia del heavy con la ambición del rock progresivo. Se consolida desde fines de los 80 con Queensrÿche, Fates Warning y Dream Theater.';
GE.pg='Metal with long, technical compositions, shifting time signatures and often keyboards: it joins the power of heavy metal with the ambition of progressive rock. It consolidated from the late 80s with Queensrÿche, Fates Warning and Dream Theater.';

{y:1965,n:'Scorpions',c:['Hannover, Alemania','Hanover, Germany'],l:'Harvest / Mercury',
h:['Rudolf Schenker fundó la banda en Hannover en 1965. Klaus Meine se convirtió en su cantante unos años después y el hermano menor de Rudolf, Michael Schenker, tocó en el debut, Lonesome Crow (1972), antes de irse a UFO. Con Uli Jon Roth primero y Matthias Jabs después, el grupo se hizo grande en Alemania y, con Blackout (1982) y Love at First Sting (1984), en Estados Unidos.','Rudolf Schenker founded the band in Hanover in 1965. Klaus Meine became its singer a few years later, and Rudolf’s younger brother Michael Schenker played on the debut, Lonesome Crow (1972), before leaving for UFO. With Uli Jon Roth first and Matthias Jabs afterwards, the group grew big in Germany and, with Blackout (1982) and Love at First Sting (1984), in the United States.'],

{y:1966,n:'The Jimi Hendrix Experience',c:['Londres, Reino Unido','London, United Kingdom'],l:'Track Records',
h:['Jimi Hendrix llegó a Londres en septiembre de 1966 de la mano de Chas Chandler, bajista de The Animals, que lo había visto tocar en Nueva York. En pocas semanas armaron el trío con Noel Redding y Mitch Mitchell. Su debut, Are You Experienced (1967), mezcló blues y rock psicodélico con un uso del feedback y del volumen que marcó al hard rock y al metal posteriores.','Jimi Hendrix arrived in London in September 1966 with Chas Chandler, bassist of The Animals, who had seen him play in New York. Within weeks they put together the trio with Noel Redding and Mitch Mitchell. Their debut, Are You Experienced (1967), mixed blues and psychedelic rock with a use of feedback and volume that shaped later hard rock and metal.'],
m:[M('Jimi Hendrix','guitarra y voz','guitar and vocals','† 1970'),M('Noel Redding','bajo','bass','† 2003'),M('Mitch Mitchell','batería','drums','† 2008')],
g:[['Are You Experienced (1967) llegó al Top 5 en el Reino Unido y en EE.UU.','Are You Experienced (1967) reached the Top 5 in both the UK and the US.'],['Su versión del himno de EE.UU. en Woodstock (1969) es una de las imágenes más famosas de la historia del rock.','His rendition of the US national anthem at Woodstock (1969) is one of the most famous images in rock history.'],['Fue incluido en el Salón de la Fama del Rock en 1992.','He was inducted into the Rock and Roll Hall of Fame in 1992.']],
p:[['La formación original duró poco: se disolvió en 1969 por tensiones internas y el desgaste de las giras.','The original lineup was short-lived: it broke up in 1969 amid internal tensions and the strain of touring.'],['Hendrix siguió con Band of Gypsys (con Buddy Miles y Billy Cox) y con otras formaciones hasta su muerte.','Hendrix went on with Band of Gypsys (with Buddy Miles and Billy Cox) and other lineups until his death.']],
a:[['En el Festival de Monterey (junio de 1967) Hendrix quemó su guitarra al final del show y se hizo famoso en Estados Unidos.','At the Monterey Festival (June 1967) Hendrix burned his guitar at the end of the show and became famous in the United States.'],['Tocaba una Stratocaster de diestro con las cuerdas invertidas, como zurdo.','He played a right-handed Stratocaster restrung upside down, as a left-hander.'],['Tres días después de su lanzamiento abrió un show en Londres con «Sgt. Pepper’s Lonely Hearts Club Band», con Paul McCartney entre el público.','Three days after its release he opened a London show with “Sgt. Pepper’s Lonely Hearts Club Band”, with Paul McCartney in the audience.']],
f:['Hendrix murió el 18 de septiembre de 1970 en Londres, a los 27 años: asfixia por aspirar su propio vómito tras una sobredosis de barbitúricos; el forense dejó un veredicto abierto. Redding murió en 2003 y Mitchell en 2008; no incluyo sus causas porque aún no las verifiqué para esta ficha.','Hendrix died on 18 September 1970 in London, aged 27: asphyxia from inhaling his own vomit after a barbiturate overdose; the coroner recorded an open verdict. Redding died in 2003 and Mitchell in 2008; I do not include their causes because I have not yet verified them for this profile.'],
s:[['Britannica: Jimi Hendrix',B+'biography/Jimi-Hendrix'],['Wikipedia: The Jimi Hendrix Experience',W+'The_Jimi_Hendrix_Experience']]},

{y:1966,n:'Blue Cheer',c:['San Francisco, EE.UU.','San Francisco, USA'],l:'Philips',
h:['Formada en San Francisco en 1966, tomó su nombre de una variedad de LSD. Su disco Vincebus Eruptum (1968) y su versión de «Summertime Blues», que llegó al Top 20 de Estados Unidos, mostraron un trío de volumen extremo y riffs pesados. Se la cita como antecedente del heavy metal y del stoner.','Formed in San Francisco in 1966, it took its name from a variety of LSD. Its album Vincebus Eruptum (1968) and its cover of “Summertime Blues”, which reached the US Top 20, showed a trio of extreme volume and heavy riffs. It is cited as a forerunner of heavy metal and stoner rock.'],

p:[['Leigh Stephens dejó la banda tras el segundo disco, Outsideinside (1968).','Leigh Stephens left the band after the second album, Outsideinside (1968).'],['El grupo se separó a comienzos de los 70 y Dickie Peterson lo reactivó varias veces, con distintas formaciones.','The group split in the early 70s and Dickie Peterson revived it several times with different lineups.']],

{y:1968,n:'Led Zeppelin',c:['Londres, Reino Unido','London, United Kingdom'],l:'Atlantic Records',
h:['Jimmy Page formó el grupo en 1968 con los restos de The Yardbirds (al principio se llamó The New Yardbirds). Con Robert Plant, John Paul Jones y John Bonham firmó con Atlantic Records y publicó su debut en enero de 1969, producido por el propio Page. Mezclaron blues pesado, folk y volumen, y el cuarto disco (1971), sin título, incluye «Stairway to Heaven».','Jimmy Page formed the group in 1968 from the remains of The Yardbirds (at first it was called The New Yardbirds). With Robert Plant, John Paul Jones and John Bonham he signed with Atlantic Records and released the debut in January 1969, produced by Page himself. They mixed heavy blues, folk and volume, and the untitled fourth album (1971) includes “Stairway to Heaven”.'],
m:[M('Jimmy Page','guitarra y producción','guitar and production'),M('Robert Plant','voz','vocals'),M('John Paul Jones','bajo y teclados','bass and keyboards'),M('John Bonham','batería','drums','† 1980')],

p:[['Tras la muerte de Bonham en 1980 la banda se disolvió; las reuniones posteriores fueron esporádicas, como la de Live Aid (1985), que los propios músicos criticaron después.','After Bonham’s death in 1980 the band broke up; later reunions were sporadic, such as Live Aid (1985), which the musicians themselves later criticised.'],['Una demanda por plagio de «Stairway to Heaven» terminó a su favor: el jurado falló por ellos en 2016 y la apelación lo confirmó en 2020.','A plagiarism suit over “Stairway to Heaven” ended in their favour: the jury sided with them in 2016 and the appeal confirmed it in 2020.']],
a:[['El nombre nació de una broma atribuida a Keith Moon y John Entwistle (The Who): un proyecto así «caería como un globo de plomo».','The name came from a joke attributed to Keith Moon and John Entwistle (The Who): a project like that would “go down like a lead balloon”.'],['Su manager, Peter Grant, exigió a las productoras condiciones de contrato muy poco habituales para la época.','Their manager, Peter Grant, demanded contract terms from the labels that were very unusual for the time.'],['El cuarto disco no lleva el nombre de la banda ni título en la portada; en lugar de eso, cada integrante eligió un símbolo.','The fourth album carries neither the band’s name nor a title on the cover; instead, each member chose a symbol.']],
f:['John Bonham murió el 25 de septiembre de 1980 en la casa de Jimmy Page en Windsor, tras beber mucho alcohol: el forense dictaminó muerte accidental por aspirar su vómito. El 4 de diciembre de 1980 la banda anunció que no podía seguir como era.','John Bonham died on 25 September 1980 at Jimmy Page’s house in Windsor after heavy drinking: the coroner ruled accidental death from inhaling vomit. On 4 December 1980 the band announced it could not continue as it was.'],

m:[M('Ozzy Osbourne','voz','vocals','† 2025'),M('Tony Iommi','guitarra','guitar'),M('Geezer Butler','bajo y letras','bass and lyrics'),M('Bill Ward','batería','drums'),M('Ronnie James Dio','voz (1979-82)','vocals (1979–82)','† 2010')],
g:[['Paranoid (1970) llegó al n.º 1 en el Reino Unido.','Paranoid (1970) reached No. 1 in the UK.'],['Entraron al Salón de la Fama del Rock en 2006.','They were inducted into the Rock and Roll Hall of Fame in 2006.'],['13 (2013), con Ozzy, Iommi y Butler, llegó al n.º 1 en el Reino Unido y en EE.UU.','13 (2013), with Ozzy, Iommi and Butler, reached No. 1 in both the UK and the US.'],['El 5 de julio de 2025 tocaron su último show en Villa Park, Birmingham, con Ozzy.','On 5 July 2025 they played their last show at Villa Park, Birmingham, with Ozzy.']],
p:[['Ozzy fue despedido en 1979 por su consumo de drogas y alcohol; entró Ronnie James Dio (Heaven and Hell, 1980).','Ozzy was fired in 1979 over drug and alcohol use; Ronnie James Dio came in (Heaven and Hell, 1980).'],['Dio dejó la banda en 1982 tras un choque por la mezcla del disco en vivo Live Evil.','Dio left in 1982 after a clash over the mix of the live album Live Evil.'],['Los 80 y 90 fueron de muchos cambios de cantante y de integrantes; en 1985 la formación original se juntó en Live Aid.','The 80s and 90s saw many singer and lineup changes; in 1985 the original lineup reunited at Live Aid.'],['Bill Ward no participó en 13 (2013) por un conflicto contractual.','Bill Ward did not take part in 13 (2013) because of a contract dispute.']],
a:[['Tony Iommi perdió las puntas de dos dedos de la mano derecha en una fábrica; se hizo fundas con plástico y afinó más grave para tocar con menos tensión.','Tony Iommi lost the tips of two fingers on his right hand in a factory; he made plastic fingertips and tuned lower to play with less tension.'],['El riff inicial usa el tritono, el intervalo llamado «diabolus in musica» en la teoría medieval.','The opening riff uses the tritone, the interval called “diabolus in musica” in medieval theory.'],['Tomaron el nombre de una película de terror italiana de 1963 de Mario Bava.','They took the name from a 1963 Italian horror film by Mario Bava.']],
f:['Ozzy Osbourne murió el 22 de julio de 2025, a los 76 años, semanas después de su último show en Birmingham; el acta de defunción indica paro cardíaco, infarto de miocardio, enfermedad coronaria y Parkinson. Ronnie James Dio murió el 16 de mayo de 2010, a los 67 años, de cáncer de estómago.','Ozzy Osbourne died on 22 July 2025, aged 76, weeks after his last show in Birmingham; the death certificate lists cardiac arrest, myocardial infarction, coronary artery disease and Parkinson’s. Ronnie James Dio died on 16 May 2010, aged 67, of stomach cancer.'],
s:[['AP vía WHYY: causa de muerte de Ozzy','https://whyy.org/articles/ozzy-osbourne-black-sabbath-heart-attack-death-certificate'],['Britannica: Black Sabbath',B+'topic/Black-Sabbath'],['Wikipedia: Ronnie James Dio',W+'Ronnie_James_Dio']]},

{y:1969,n:'Judas Priest',c:['West Bromwich, Reino Unido','West Bromwich, United Kingdom'],l:'Gull Records',
h:['Fundada en 1969 por Al Atkins e Ian Hill. Rob Halford entró en 1973 y el dúo de guitarras de K.K. Downing y Glenn Tipton definió su sonido. Tras Rocka Rolla (1974) y Sad Wings of Destiny (1976), British Steel (1980) fijó el modelo de canción corta y directa del heavy metal, con la imagen de cuero y tachas.','Founded in 1969 by Al Atkins and Ian Hill. Rob Halford joined in 1973 and the guitar duo of K.K. Downing and Glenn Tipton defined its sound. After Rocka Rolla (1974) and Sad Wings of Destiny (1976), British Steel (1980) set the template of the short, direct heavy metal song, with the leather-and-studs image.'],
m:[M('Rob Halford','voz','vocals'),M('K.K. Downing','guitarra','guitar'),M('Glenn Tipton','guitarra','guitar'),M('Ian Hill','bajo','bass'),M('Tim “Ripper” Owens','voz (1996-2003)','vocals (1996–2003)')],
g:[['British Steel (1980) y Painkiller (1990) se citan entre los discos que más influyeron en el metal posterior.','British Steel (1980) and Painkiller (1990) are cited among the albums that most influenced later metal.'],['Ganaron un Grammy a la mejor interpretación de metal en 2010 por «Dissident Aggressor» en vivo.','They won a Grammy for Best Metal Performance in 2010 for a live “Dissident Aggressor”.'],['Firepower (2018) fue su mejor posición en la lista de álbumes de EE.UU. (n.º 5).','Firepower (2018) was their best placing on the US album chart (No. 5).']],
p:[['Halford dejó la banda en 1992; Tim «Ripper» Owens cantó de 1996 a 2003 (Jugulator, Demolition) y Halford volvió en 2003.','Halford left in 1992; Tim “Ripper” Owens sang from 1996 to 2003 (Jugulator, Demolition) and Halford returned in 2003.'],['K.K. Downing se retiró en 2011 y Richie Faulkner ocupó su lugar.','K.K. Downing retired in 2011 and Richie Faulkner took his place.'],['En 1990 un tribunal de Nevada desestimó una demanda de dos familias que acusaban a la banda de mensajes subliminales en un disco.','In 1990 a Nevada court dismissed a suit by two families accusing the band of subliminal messages on a record.']],
a:[['El nombre viene de «The Ballad of Frankie Lee and Judas Priest», de Bob Dylan.','The name comes from “The Ballad of Frankie Lee and Judas Priest” by Bob Dylan.'],['Halford popularizó el cuero y las tachas en el escenario a fines de los años 70.','Halford popularised leather and studs on stage in the late 1970s.'],['Desde los años 80 Halford sale al escenario en una moto Harley-Davidson.','Since the 1980s Halford has ridden onto the stage on a Harley-Davidson motorcycle.'],['En 1998 Halford dijo en una entrevista de MTV que es gay, algo poco común entre las grandes figuras del metal en aquel momento.','In 1998 Halford said in an MTV interview that he is gay, something rare among major metal figures at the time.']],
f:['Pendiente: todavía no verifiqué fallecimientos de integrantes históricos de esta banda, por eso no los menciono. Lo más duro conocido: Glenn Tipton tiene Parkinson (diagnosticado en 2008 y hecho público en 2018) y dejó de salir de gira.','Pending: I have not yet verified deaths of historic members of this band, so none are mentioned. The hardest known blow: Glenn Tipton has Parkinson’s disease (diagnosed in 2008, made public in 2018) and stopped touring.'],
s:[['Britannica: Judas Priest',B+'topic/Judas-Priest'],['Wikipedia: Judas Priest',W+'Judas_Priest']]},

{y:1972,n:'Twisted Sister',c:['Nueva Jersey, EE.UU.','New Jersey, USA'],l:'Secret Records / Atlantic',
h:['Fundada en 1972 en Nueva Jersey, pasó años tocando en clubes de Nueva York y Nueva Jersey con formaciones cambiantes. Dee Snider entró como cantante en 1976 y, con su maquillaje glam y su estilo agresivo, llenó locales durante mucho tiempo sin conseguir contrato en EE.UU. Firmó con el sello británico Secret Records: Under the Blade (1982) y después Stay Hungry (1984), con «We’re Not Gonna Take It» y «I Wanna Rock».','Founded in 1972 in New Jersey, it spent years playing clubs in New York and New Jersey with changing lineups. Dee Snider joined as singer in 1976 and, with his glam make-up and aggressive style, the band filled venues for a long time without landing a US record deal. It signed with the British label Secret Records: Under the Blade (1982) and then Stay Hungry (1984), with “We’re Not Gonna Take It” and “I Wanna Rock”.'],
m:[M('Dee Snider','voz','vocals'),M('Jay Jay French','guitarra','guitar'),M('Eddie “Fingers” Ojeda','guitarra','guitar'),M('Mark “The Animal” Mendoza','bajo','bass'),M('A. J. Pero','batería','drums','† 2015')],
g:[['Stay Hungry (1984) fue multiplatino en EE.UU. y los volvió estrellas de MTV.','Stay Hungry (1984) went multi-platinum in the US and made them MTV stars.'],['«We’re Not Gonna Take It» se convirtió en uno de los himnos del metal de los 80.','“We’re Not Gonna Take It” became one of the anthems of 80s metal.']],
p:[['En 1985 Dee Snider declaró ante el Comité de Comercio del Senado de EE.UU. (caso PMRC) junto a Frank Zappa y John Denver, defendiendo las letras del rock.','In 1985 Dee Snider testified before the US Senate Commerce Committee (the PMRC hearing) alongside Frank Zappa and John Denver, defending rock lyrics.'],['La banda se disolvió en 1987 tras discos con menos éxito que Stay Hungry.','The band split in 1987 after albums that sold less than Stay Hungry.'],['Se reunió a comienzos de los 2000 y volvió a girar con éxito en festivales; hizo una gira de despedida entre 2014 y 2016.','It reunited in the early 2000s and toured successfully at festivals; it did a farewell tour between 2014 and 2016.']],
a:[['En el video de «We’re Not Gonna Take It» el padre autoritario lo interpreta Mark Metcalf, el Neidermeyer de «Animal House».','In the “We’re Not Gonna Take It” video the domineering father is played by Mark Metcalf, Neidermeyer from “Animal House”.'],['Antes de tener contrato en EE.UU. tocaron durante años en clubes de la zona de Nueva York, y el primer paso fue firmar en el Reino Unido.','Before having a US deal they played club after club around New York for years, and the breakthrough came by signing in the UK.'],['Snider condujo luego un programa de radio de rock de los 80, «House of Hair».','Snider later hosted an 80s rock radio show, “House of Hair”.']],
f:['A. J. Pero murió el 20 de marzo de 2015, a los 55 años, por un ataque al corazón, mientras estaba de gira con Adrenaline Mob.','A. J. Pero died on 20 March 2015, aged 55, of a heart attack while on tour with Adrenaline Mob.'],
s:[['Wikipedia: Twisted Sister',W+'Twisted_Sister'],['Wikipedia: A. J. Pero',W+'A._J._Pero']]},

{y:1973,n:'Journey',c:['San Francisco, EE.UU.','San Francisco, USA'],l:'Columbia',
h:['Neal Schon y Gregg Rolie, ambos ex Santana, formaron Journey en San Francisco en 1973. Los primeros discos fueron de rock instrumental y progresivo; con la llegada del cantante Steve Perry en 1977 pasaron a un rock melódico de radio (AOR). Escape (1981), con «Don’t Stop Believin’», fue n.º 1 en EE.UU., y Frontiers (1983) los consolidó como una de las grandes bandas de estadios.','Neal Schon and Gregg Rolie, both formerly of Santana, formed Journey in San Francisco in 1973. The first albums were instrumental, progressive-leaning rock; with singer Steve Perry’s arrival in 1977 they moved to melodic radio rock (AOR). Escape (1981), with “Don’t Stop Believin’”, hit No. 1 in the US, and Frontiers (1983) cemented them as one of the great stadium bands.'],
m:[M('Neal Schon','guitarra','guitar'),M('Gregg Rolie','teclados y voz (1973-80)','keyboards and vocals (1973–80)'),M('Steve Perry','voz (1977-87, 1995-98)','vocals (1977–87, 1995–98)'),M('Ross Valory','bajo','bass'),M('Jonathan Cain','teclados (desde 1980)','keyboards (from 1980)'),M('Steve Smith','batería','drums'),M('Arnel Pineda','voz (desde 2007)','vocals (from 2007)')],
g:[['Escape (1981) fue n.º 1 en la lista de álbumes de EE.UU.','Escape (1981) hit No. 1 on the US album chart.'],['«Don’t Stop Believin’» es una de las canciones más descargadas de la era digital.','“Don’t Stop Believin’” is one of the most downloaded songs of the digital era.'],['Fueron incluidos en el Salón de la Fama del Rock en 2017.','They were inducted into the Rock and Roll Hall of Fame in 2017.']],
p:[['Rolie dejó el grupo en 1980 y entró Jonathan Cain; en 1985 salieron el bajista Ross Valory y el baterista Steve Smith.','Rolie left in 1980 and Jonathan Cain came in; in 1985 bassist Ross Valory and drummer Steve Smith left.'],['Perry se fue en 1987, volvió en los 90 y dejó la banda en 1998 después de una lesión de cadera que frenó una gira.','Perry left in 1987, returned in the 90s and left the band in 1998 after a hip injury halted a tour.'],['En marzo de 2020 Schon y Cain despidieron a Valory y Smith en medio de una disputa legal por el control de la marca; se resolvió con un acuerdo en 2021.','In March 2020 Schon and Cain fired Valory and Smith amid a legal dispute over control of the band’s brand; it was settled in 2021.']],
a:[['Arnel Pineda, nacido en Manila, fue descubierto por Neal Schon a través de videos en YouTube y es cantante del grupo desde 2007.','Arnel Pineda, from Manila, was discovered by Neal Schon through YouTube videos and has been the group’s singer since 2007.'],['El final de «Los Soprano» (junio de 2007) usó «Don’t Stop Believin’» y devolvió la canción a las listas.','The finale of “The Sopranos” (June 2007) used “Don’t Stop Believin’” and sent the song back up the charts.'],['En 1982 salió «Journey Escape», un videojuego para Atari 2600 inspirado en la banda.','In 1982 “Journey Escape”, an Atari 2600 video game based on the band, was released.']],
f:['Pendiente: todavía no verifiqué fallecimientos de integrantes históricos de esta banda, por eso no los menciono.','Pending: I have not yet verified deaths of historic members of this band, so none are mentioned.'],
s:[['Wikipedia: Journey',W+'Journey_(band)'],['Louder: despidos de Smith y Valory (2020)','https://loudersound.com/news/journey-sack-steve-smith-and-ross-valory']]},

{y:1973,n:'Kiss',c:['Nueva York, EE.UU.','New York, USA'],l:'Casablanca',
h:['Fundada en Nueva York en 1973 por Paul Stanley y Gene Simmons, con Ace Frehley y Peter Criss. Con maquillaje de personajes, fuego, sangre falsa y botas con plataforma, grabaron su debut en 1974 para Casablanca. El disco en vivo Alive! (1975) los lanzó al éxito y Destroyer (1976) los consolidó.','Founded in New York in 1973 by Paul Stanley and Gene Simmons, with Ace Frehley and Peter Criss. With character make-up, fire, fake blood and platform boots, they recorded their debut in 1974 for Casablanca. The live album Alive! (1975) launched them to success and Destroyer (1976) consolidated it.'],
m:[M('Paul Stanley','voz y guitarra','vocals and guitar'),M('Gene Simmons','bajo y voz','bass and vocals'),M('Ace Frehley','guitarra (1973-82, 1996-2002)','guitar (1973–82, 1996–2002)','† 2025'),M('Peter Criss','batería (1973-80, 1996-2004, con pausas)','drums (1973–80, 1996–2004, with breaks)'),M('Eric Carr','batería (1980-91)','drums (1980–91)','† 1991'),M('Bruce Kulick','guitarra (1984-96)','guitar (1984–96)')],
g:[['Alive! (1975) se considera el disco que consolidó a la banda y se le atribuye haber ayudado a salvar las finanzas de su sello, Casablanca.','Alive! (1975) is regarded as the album that made the band and is credited with helping rescue the finances of its label, Casablanca.'],['Fueron incluidos en el Salón de la Fama del Rock en 2014 (solo la formación original).','They were inducted into the Rock and Roll Hall of Fame in 2014 (original lineup only).'],['Su gira de despedida terminó el 2 de diciembre de 2023 en el Madison Square Garden de Nueva York.','Their farewell tour ended on 2 December 2023 at New York’s Madison Square Garden.']],
p:[['Criss dejó la banda en 1980 y Frehley en 1982; Eric Carr y luego otros músicos ocuparon sus lugares.','Criss left in 1980 and Frehley in 1982; Eric Carr and later other musicians took their places.'],['En 1983 se quitaron el maquillaje y el éxito bajó; en 1996 la formación original volvió con maquillaje en una gira de reunión muy exitosa.','In 1983 they removed the make-up and success dipped; in 1996 the original lineup came back in make-up on a hugely successful reunion tour.'],['Frehley y Criss volvieron a salir (2002 y 2004). Sus personajes pasaron a Tommy Thayer y Eric Singer, lo que fue criticado por parte de los fans; Frehley dijo que nunca lo habían echado.','Frehley and Criss left again (2002 and 2004). Their characters passed to Tommy Thayer and Eric Singer, which drew criticism from some fans; Frehley said he was never fired.']],
a:[['El logo con los dos rayos lo diseñó Ace Frehley; por su parecido con las runas SS, en Alemania se usó una versión modificada.','The two-lightning-bolt logo was designed by Ace Frehley; because of its resemblance to SS runes, a modified version is used in Germany.'],['Se quitaron el maquillaje por primera vez en vivo en MTV el 18 de septiembre de 1983, con el disco Lick It Up.','They first removed their make-up on live MTV on 18 September 1983, with the album Lick It Up.'],['Tras la gira de despedida anunciaron que seguirán como avatares digitales.','After the farewell tour they announced they would continue as digital avatars.']],
f:['Eric Carr murió el 24 de noviembre de 1991, a los 41 años, por un cáncer de corazón. Ace Frehley murió el 16 de octubre de 2025, a los 74 años, después de una caída en su estudio en septiembre; el médico forense dictaminó muerte accidental por traumatismo craneal.','Eric Carr died on 24 November 1991, aged 41, of heart cancer. Ace Frehley died on 16 October 2025, aged 74, after a fall in his studio in September; the medical examiner ruled accidental death from head trauma.'],
s:[['Wikipedia: Kiss',W+'Kiss_(band)'],['Wikipedia: Eric Carr',W+'Eric_Carr'],['UPI: causa de muerte de Ace Frehley','https://www.upi.com/Entertainment_News/2025/11/11/KISS-band-Ace-Frehley-cause-of-death/6821762893689/']]},

{y:1973,n:'Thor',c:['Vancouver, Canadá','Vancouver, Canada'],l:'RCA',
h:['Thor nació en 1973 como un concepto del culturista de Vancouver Jon Mikl Thor, el primer canadiense en ganar los títulos Mr. Canada y Mr. USA. Antes de llamarse Thor usó nombres como Centaur y Mikl Body Rock. Su primer disco fue Keep the Dogs Away (1977), y sus shows mezclaban metal con trajes, máscaras y pruebas de fuerza.','Thor began in 1973 as a concept by Vancouver bodybuilder Jon Mikl Thor, the first Canadian to win both the Mr. Canada and Mr. USA titles. Before being called Thor he used names such as Centaur and Mikl Body Rock. His first album was Keep the Dogs Away (1977), and his shows mixed metal with costumes, masks and feats of strength.'],
m:[M('Jon Mikl Thor','voz','vocals'),M('John Leibel','guitarra','guitar'),M('Ted Jedlicki','bajo','bass'),M('Frank Soda','guitarra','guitar')],
g:[['Se lo cita como adelantado del metal teatral de espadas y fantasía, antes que Manowar o GWAR.','He is cited as a forerunner of theatrical sword-and-fantasy metal, before Manowar or GWAR.'],['Protagonizó películas de culto como «Zombie Nightmare» y «Rock ’n’ Roll Nightmare» (ambas de 1987).','He starred in cult films such as “Zombie Nightmare” and “Rock ’n’ Roll Nightmare” (both 1987).'],['El documental «I Am Thor» (2015) cuenta su historia y se estrenó en el festival Slamdance.','The documentary “I Am Thor” (2015) tells his story and premiered at the Slamdance festival.']],
p:[['Parte de la crítica se burló de su voz y de su físico, pero el público de culto lo siguió.','Part of the press mocked his voice and physique, but a cult audience stayed with him.'],['Tras años de gira se instaló en Nueva York y su fama quedó ligada a los 70 y 80; volvió a publicar discos, como Metal Avenger (2015).','After years of touring he settled in New York and his fame stayed tied to the 70s and 80s; he kept releasing albums, such as Metal Avenger (2015).']],
a:[['En sus shows inflaba una bolsa de agua caliente con los pulmones hasta que explotaba y doblaba barras de acero con los dientes.','In his shows he blew into a hot-water bottle until it burst and bent steel bars with his teeth.'],['Hacía que le rompieran bloques de cemento sobre el pecho con una maza.','He had concrete blocks smashed on his chest with a sledgehammer.'],['Bob Geldof, entonces crítico musical en Vancouver, elogió sus primeros shows.','Bob Geldof, then a music critic in Vancouver, praised his early shows.'],['Thor resucitó como marca a los Vancouver Millionaires, el equipo de hockey campeón de la Stanley Cup en 1915.','Thor revived, as a brand, the Vancouver Millionaires, the hockey team that won the Stanley Cup in 1915.']],
f:['Pendiente: no encontré fallecimientos de integrantes históricos verificados y no los menciono; hasta donde consulté, Jon Mikl Thor sigue activo.','Pending: I found no verified deaths of historic members and mention none; as far as I checked, Jon Mikl Thor is still active.'],
s:[['Wikipedia: Thor (band)',W+'Thor_(band)'],['Wikipedia: Jon Mikl Thor',W+'Jon_Mikl_Thor']]},

{y:1974,n:'Raven',c:['Newcastle, Reino Unido','Newcastle, United Kingdom'],l:'Neat / Megaforce / Atlantic',
h:['Formada en Newcastle en 1974 por los hermanos John (bajo y voz) y Mark Gallagher (guitarra). Su energía en vivo, con ropa deportiva, les valió el apodo de «athletic rock». Rock Until You Drop (1981) fue el primer LP de Neat Records, y Megaforce los llevó a EE.UU., donde influyeron en el thrash.','Formed in Newcastle in 1974 by brothers John (bass and vocals) and Mark Gallagher (guitar). Their high-energy live show, in sportswear, earned them the nickname “athletic rock”. Rock Until You Drop (1981) was Neat Records’ first LP, and Megaforce took them to the US, where they influenced thrash.'],
m:[M('John Gallagher','bajo y voz','bass and vocals'),M('Mark Gallagher','guitarra','guitar'),M('Rob “Wacko” Hunter','batería (años 80)','drums (1980s)'),M('Joe Hasselvander','batería (fines de los 80)','drums (late 1980s)'),M('Mike Heller','batería (actual)','drums (current)')],
g:[['En 1983 encabezaron la gira «Kill ’Em All for One», la primera gira nacional de Metallica en EE.UU., que abría para ellos.','In 1983 they headlined the “Kill ’Em All for One” tour, Metallica’s first national tour in the US, with Metallica as the opening act.'],['Se los cita como influencia de Metallica, Slayer, Megadeth, Anthrax y de gran parte del thrash.','They are cited as an influence on Metallica, Slayer, Megadeth, Anthrax and much of thrash.'],['En 2014 abrieron para Metallica en São Paulo ante unas 70.000 personas.','In 2014 they opened for Metallica in São Paulo in front of some 70,000 people.']],
p:[['Tras el impulso de Megaforce firmaron con Atlantic (con una pequeña puja entre sellos), pero no llegaron al nivel de las bandas que influyeron.','After the Megaforce push they signed with Atlantic (after a small bidding war among labels), but never reached the level of the bands they influenced.'],['En 2001 un muro se derrumbó sobre Mark Gallagher y le aplastó las piernas; la banda se detuvo cerca de cinco años.','In 2001 a wall collapsed on Mark Gallagher and crushed his legs; the band paused for nearly five years.'],['Volvieron a tocar en 2004, con Mark en silla de ruedas; en 2006 ya estaba recuperado.','They played again in 2004, with Mark in a wheelchair; by 2006 he had recovered.']],
a:[['Compartían manager con Metallica (Jon «Johnny Z» Zazula, de Megaforce); según Mark Gallagher, en muchos lugares al público no le gustaba Metallica.','They shared a manager with Metallica (Jon “Johnny Z” Zazula of Megaforce); according to Mark Gallagher, in many places the crowd did not like Metallica.'],['Usaban ropa deportiva en el escenario, de ahí el nombre «athletic rock».','They wore sportswear on stage, hence the name “athletic rock”.']],
f:['Mark Gallagher estuvo cerca de perder las piernas en el accidente de 2001. No tengo verificados fallecimientos de integrantes históricos.','Mark Gallagher came close to losing his legs in the 2001 accident. I have no verified deaths of historic members.'],
s:[['Wikipedia: Raven',W+'Raven_(British_band)'],['Guitar Player: Raven sobre la gira con Metallica','https://www.guitarplayer.com/guitarists/raven-on-touring-with-metallica-in-1983']]},

{y:1975,n:'Boston',c:['Boston, EE.UU.','Boston, USA'],l:'Epic / MCA',
h:['El ingeniero Tom Scholz, graduado del MIT, grabó maquetas durante años en su sótano de Boston junto al cantante Brad Delp. Con Epic Records publicaron Boston (1976), un debut enorme en ventas con «More Than a Feeling», en el que Scholz tocó casi todos los instrumentos. Scholz inventó también el amplificador compacto Rockman.','Engineer Tom Scholz, an MIT graduate, spent years recording demos in his Boston basement with singer Brad Delp. With Epic Records they released Boston (1976), a debut with huge sales featuring “More Than a Feeling”, on which Scholz played most of the instruments. Scholz also invented the compact Rockman amplifier.'],
m:[M('Tom Scholz','guitarra, teclados y producción','guitar, keyboards and production'),M('Brad Delp','voz','vocals','† 2007'),M('Barry Goudreau','guitarra','guitar'),M('Fran Sheehan','bajo','bass'),M('Sib Hashian','batería','drums','† 2017')],
g:[['Boston (1976) es uno de los debuts más vendidos de la historia.','Boston (1976) is one of the best-selling debuts in history.'],['Third Stage (1986) y su sencillo «Amanda» llegaron al n.º 1 en EE.UU.','Third Stage (1986) and its single “Amanda” topped the charts in the US.']],
p:[['Pasaron ocho años entre Don’t Look Back (1978) y Third Stage (1986) por el perfeccionismo de Scholz y un pleito con el sello: CBS lo demandó por 60 millones de dólares por no entregar el disco a tiempo.','Eight years passed between Don’t Look Back (1978) and Third Stage (1986) because of Scholz’s perfectionism and a dispute with the label: CBS sued him for 60 million dollars for failing to deliver the album on time.'],['Goudreau dejó la banda en 1981 y formó Orion the Hunter; Hashian, Sheehan y Goudreau demandaron a Scholz por la compensación de Third Stage.','Goudreau left in 1981 and formed Orion the Hunter; Hashian, Sheehan and Goudreau sued Scholz over compensation for Third Stage.'],['Delp se fue a fines de los 80 y volvió más tarde.','Delp left in the late 80s and returned later.']],
a:[['Tom Scholz es el único miembro original que no nació en Boston (nació en Toledo, Ohio).','Tom Scholz is the only original member not born in Boston (he was born in Toledo, Ohio).'],['Durante Third Stage se lastimó la espalda y grabó muchas partes acostado sobre una tabla de surf.','During Third Stage he hurt his back and recorded many parts lying on a surfboard.'],['Tommy DeCarlo, un fan, subió un homenaje a Delp a internet y terminó cantando en la banda.','Tommy DeCarlo, a fan, posted a Delp tribute online and ended up singing in the band.']],
f:['Brad Delp fue hallado muerto en su casa de Atkinson, New Hampshire, el 9 de marzo de 2007, a los 55 años; su muerte fue un suicidio. Sib Hashian murió el 22 de marzo de 2017, a los 67 años, tras desplomarse durante un show en un crucero.','Brad Delp was found dead at his home in Atkinson, New Hampshire, on 9 March 2007, aged 55; his death was a suicide. Sib Hashian died on 22 March 2017, aged 67, after collapsing during a show on a cruise ship.'],

{y:1975,n:'Iron Maiden',c:['Londres, Reino Unido','London, United Kingdom'],l:'EMI',
h:['Steve Harris fundó Iron Maiden en la Navidad de 1975 en el este de Londres. Con la demo The Soundhouse Tapes y shows en pubs lograron un contrato con EMI. Paul Di’Anno cantó en el debut Iron Maiden (1980) y en Killers (1981); con Bruce Dickinson, desde 1981, llegaron The Number of the Beast (1982), Powerslave (1984) y Seventh Son of a Seventh Son (1988).','Steve Harris founded Iron Maiden at Christmas 1975 in east London. With the demo The Soundhouse Tapes and pub gigs they won a deal with EMI. Paul Di’Anno sang on the debut Iron Maiden (1980) and on Killers (1981); with Bruce Dickinson, from 1981, came The Number of the Beast (1982), Powerslave (1984) and Seventh Son of a Seventh Son (1988).'],
m:[M('Steve Harris','bajo y composición','bass and songwriting'),M('Dave Murray','guitarra','guitar'),M('Adrian Smith','guitarra','guitar'),M('Bruce Dickinson','voz','vocals'),M('Nicko McBrain','batería (1982-2024)','drums (1982–2024)'),M('Paul Di’Anno','voz (1978-81)','vocals (1978–81)','† 2024'),M('Clive Burr','batería (1979-82)','drums (1979–82)','† 2013'),M('Janick Gers','guitarra (desde 1990)','guitar (from 1990)')],
g:[['The Number of the Beast (1982) llegó al n.º 1 en el Reino Unido, igual que Seventh Son of a Seventh Son (1988).','The Number of the Beast (1982) reached No. 1 in the UK, as did Seventh Son of a Seventh Son (1988).'],['Bruce Dickinson y Adrian Smith volvieron en 1999 y Brave New World (2000) reabrió una etapa de grandes giras.','Bruce Dickinson and Adrian Smith returned in 1999 and Brave New World (2000) opened a new era of big tours.'],['En la gira de The Book of Souls (2016) Dickinson pilotó el Boeing 747 que transportaba a la banda.','On the Book of Souls tour (2016) Dickinson piloted the Boeing 747 that carried the band.']],
p:[['Dennis Stratton salió tras el debut; en 1981 echaron a Di’Anno, que reconoció años después que no los culpaba por haberlo hecho.','Dennis Stratton left after the debut; in 1981 they fired Di’Anno, who said years later that he did not blame them.'],['Adrian Smith se fue en 1990 y entró Janick Gers; Dickinson se fue en 1993 y Blaze Bayley cantó de 1994 a 1999.','Adrian Smith left in 1990 and Janick Gers came in; Dickinson left in 1993 and Blaze Bayley sang from 1994 to 1999.'],['La vuelta de Dickinson y Smith en 1999 reconcilió a la banda con su público.','The return of Dickinson and Smith in 1999 reconciled the band with its audience.']],
a:[['El nombre viene de un instrumento de tortura medieval, la «dama de hierro».','The name comes from a medieval torture device, the “iron maiden”.'],['En 1982 grupos religiosos de EE.UU. protestaron contra The Number of the Beast.','In 1982 religious groups in the US protested against The Number of the Beast.'],['Su mascota, Eddie, fue ilustrada durante décadas por Derek Riggs.','Their mascot, Eddie, was illustrated for decades by Derek Riggs.']],
f:['Clive Burr murió el 12 de marzo de 2013, a los 56 años, tras años de esclerosis múltiple. Paul Di’Anno murió a los 66 años; su familia lo anunció el 21 de octubre de 2024 y no se informó la causa. Bruce Dickinson superó un cáncer de lengua en 2015, y Nicko McBrain tuvo un derrame cerebral en 2023.','Clive Burr died on 12 March 2013, aged 56, after years of multiple sclerosis. Paul Di’Anno died aged 66; his family announced it on 21 October 2024 and no cause was reported. Bruce Dickinson overcame tongue cancer in 2015, and Nicko McBrain had a stroke in 2023.'],

{y:1975,n:'Jeff Beck',c:['Londres, Reino Unido','London, United Kingdom'],l:'Epic',
h:['Guitarrista británico que pasó por The Yardbirds (1965-66), el Jeff Beck Group (con Rod Stewart y Ronnie Wood) y Beck, Bogert & Appice. En 1975 publicó Blow by Blow, un disco instrumental de rock y jazz producido por George Martin, y siguió con Wired (1976). Su manera de tocar, con los dedos y la palanca, influyó en generaciones de guitarristas de rock y metal.','British guitarist who passed through The Yardbirds (1965–66), the Jeff Beck Group (with Rod Stewart and Ronnie Wood) and Beck, Bogert & Appice. In 1975 he released Blow by Blow, an instrumental rock-jazz album produced by George Martin, and followed with Wired (1976). His playing, with fingers and whammy bar, influenced generations of rock and metal guitarists.'],
m:[M('Jeff Beck','guitarra','guitar','† 2023'),M('Jan Hammer','teclados (Wired)','keyboards (Wired)'),M('Max Middleton','teclados','keyboards'),M('Rod Stewart','voz (Jeff Beck Group)','vocals (Jeff Beck Group)'),M('Tal Wilkenfeld','bajo (años 2000)','bass (2000s)')],
g:[['Entró dos veces en el Salón de la Fama del Rock: con The Yardbirds (1992) y como solista (2009).','He was inducted twice into the Rock and Roll Hall of Fame: with The Yardbirds (1992) and as a solo artist (2009).'],['Blow by Blow (1975) fue un éxito de ventas para un disco instrumental.','Blow by Blow (1975) was a strong seller for an instrumental album.'],['Ganó varios premios Grammy a lo largo de su carrera.','He won several Grammy awards over his career.']],
p:[['Dejó The Yardbirds en 1966 y su primer grupo propio se disolvió en 1969 en medio de tensiones internas.','He left The Yardbirds in 1966 and his first group of his own split in 1969 amid internal tensions.'],['Un accidente de auto en 1969 lo dejó sin tocar durante meses.','A car accident in 1969 kept him from playing for months.']],
a:[['Tocaba sin púa: usaba los dedos y la palanca para dar curvas y vibratos propios.','He played without a pick: he used his fingers and the whammy bar for his own bends and vibratos.'],['Fue un apasionado de los autos clásicos y construyó hot rods.','He was a passionate classic-car fan and built hot rods.']],
f:['Jeff Beck murió el 10 de enero de 2023, a los 78 años, por meningitis bacteriana.','Jeff Beck died on 10 January 2023, aged 78, of bacterial meningitis.'],
s:[['Wikipedia: Jeff Beck',W+'Jeff_Beck']]},

{y:1975,n:'Motörhead',c:['Londres, Reino Unido','London, United Kingdom'],l:'Bronze',
h:['Lemmy Kilmister fue echado de Hawkwind en 1975, tras ser detenido en la frontera de Canadá por posesión de drogas, y fundó su propia banda. Tomó el nombre Motörhead de la última canción que escribió para Hawkwind. La formación clásica con Eddie «Fast» Clarke y Phil «Philthy Animal» Taylor grabó Overkill (1979), Bomber (1979), Ace of Spades (1980) y el disco en vivo No Sleep ’til Hammersmith (1981).','Lemmy Kilmister was fired from Hawkwind in 1975, after being detained at the Canadian border for drug possession, and founded his own band. He took the name Motörhead from the last song he wrote for Hawkwind. The classic lineup with Eddie “Fast” Clarke and Phil “Philthy Animal” Taylor recorded Overkill (1979), Bomber (1979), Ace of Spades (1980) and the live album No Sleep ’til Hammersmith (1981).'],
m:[M('Lemmy','bajo y voz','bass and vocals','† 2015'),M('Eddie Clarke','guitarra (1976-82)','guitar (1976–82)','† 2018'),M('Phil Taylor','batería (1975-84, 1987-92)','drums (1975–84, 1987–92)','† 2015'),M('Phil Campbell','guitarra (1984-2015)','guitar (1984–2015)'),M('Würzel','guitarra (1984-95)','guitar (1984–95)','† 2011'),M('Mikkey Dee','batería (1992-2015)','drums (1992–2015)')],
g:[['No Sleep ’til Hammersmith (1981) debutó en el n.º 1 de la lista británica.','No Sleep ’til Hammersmith (1981) debuted at No. 1 on the UK chart.'],['«Ace of Spades» es su canción más conocida y es un himno del rock y el metal.','“Ace of Spades” is their best-known song and an anthem of rock and metal.'],['Su mezcla de punk y metal influyó en el thrash y el speed metal.','Their blend of punk and metal influenced thrash and speed metal.']],
p:[['Eddie Clarke se fue en 1982; después pasaron Brian Robertson y otros hasta la formación de Phil Campbell y Würzel (1984).','Eddie Clarke left in 1982; Brian Robertson and others followed until the Phil Campbell and Würzel lineup (1984).'],['Phil Taylor dejó la banda en 1984 y lo reemplazó Pete Gill, ex Saxon; Taylor volvió en 1987.','Phil Taylor left in 1984 and was replaced by Pete Gill, formerly of Saxon; Taylor returned in 1987.'],['Los 80 fueron de altibajos comerciales; la formación de los 90, con Mikkey Dee, estabilizó la banda hasta 2015.','The 80s saw commercial ups and downs; the 90s lineup with Mikkey Dee steadied the band until 2015.']],
a:[['Lemmy tocaba el bajo con acordes de guitarra, muy fuerte y distorsionado, lo que le dio un sonido propio.','Lemmy played bass with guitar-style chords, very loud and distorted, giving him a sound of his own.'],['Era famoso por beber bourbon con cola todos los días.','He was famous for drinking bourbon and cola every day.'],['Murió pocos días después de enterarse de que tenía un cáncer muy agresivo.','He died only a few days after learning he had a very aggressive cancer.']],
f:['Würzel murió el 9 de julio de 2011, a los 61 años, por un ataque al corazón. Phil Taylor murió el 11 de noviembre de 2015, a los 61 años. Lemmy murió el 28 de diciembre de 2015, a los 70 años, por cáncer de próstata, arritmia cardíaca e insuficiencia cardíaca congestiva; tras su muerte la banda terminó. Eddie Clarke murió el 10 de enero de 2018, a los 67 años, por neumonía.','Würzel died on 9 July 2011, aged 61, of a heart attack. Phil Taylor died on 11 November 2015, aged 61. Lemmy died on 28 December 2015, aged 70, of prostate cancer, cardiac arrhythmia and congestive heart failure; after his death the band ended. Eddie Clarke died on 10 January 2018, aged 67, of pneumonia.'],

{y:1975,n:'Rainbow',c:['Londres, Reino Unido','London, United Kingdom'],l:'Oyster / Polydor',
h:['Ritchie Blackmore dejó Deep Purple en 1975 y formó Rainbow con el cantante Ronnie James Dio y músicos de su banda Elf. El primer disco, Ritchie Blackmore’s Rainbow (1975), fue seguido por Rising (1976), con Cozy Powell en la batería, y por Long Live Rock ’n’ Roll (1978). Después Dio se fue y Rainbow giró hacia un sonido más comercial con Graham Bonnet y Joe Lynn Turner.','Ritchie Blackmore left Deep Purple in 1975 and formed Rainbow with singer Ronnie James Dio and musicians from his band Elf. The first album, Ritchie Blackmore’s Rainbow (1975), was followed by Rising (1976), with Cozy Powell on drums, and Long Live Rock ’n’ Roll (1978). Then Dio left and Rainbow turned to a more commercial sound with Graham Bonnet and Joe Lynn Turner.'],
m:[M('Ritchie Blackmore','guitarra','guitar'),M('Ronnie James Dio','voz (1975-78)','vocals (1975–78)','† 2010'),M('Cozy Powell','batería (1975-80)','drums (1975–80)','† 1998'),M('Graham Bonnet','voz (1979-80)','vocals (1979–80)'),M('Joe Lynn Turner','voz (1980-84)','vocals (1980–84)'),M('Roger Glover','bajo (1979-84)','bass (1979–84)')],
g:[['Rising (1976) es considerado uno de los discos fundamentales del hard rock épico y del metal temprano.','Rising (1976) is considered a cornerstone of epic hard rock and early metal.'],['Encabezaron el primer festival Monsters of Rock en Castle Donington, el 16 de agosto de 1980, con Judas Priest, Scorpions, Saxon y Riot entre los invitados.','They headlined the first Monsters of Rock festival at Castle Donington on 16 August 1980, with Judas Priest, Scorpions, Saxon and Riot among the guests.'],['«Since You Been Gone» (1979) fue un gran éxito en el Reino Unido.','“Since You Been Gone” (1979) was a major hit in the UK.']],

a:[['El primer disco se grabó en Múnich, en el estudio Musicland.','The first album was recorded in Munich, at Musicland Studios.'],['En los shows de los 70 usaban un enorme arco iris iluminado como escenografía.','In their 70s shows they used an enormous lit-up rainbow as stage design.'],['«Since You Been Gone» es una versión de una canción de Russ Ballard.','“Since You Been Gone” is a cover of a song by Russ Ballard.']],
f:['Cozy Powell murió el 5 de abril de 1998, a los 50 años, en un accidente de auto en la autopista M4, cerca de Bristol. Ronnie James Dio murió el 16 de mayo de 2010, a los 67 años, de cáncer de estómago.','Cozy Powell died on 5 April 1998, aged 50, in a car crash on the M4 motorway near Bristol. Ronnie James Dio died on 16 May 2010, aged 67, of stomach cancer.'],

{y:1975,n:'Riot',c:['Nueva York, EE.UU.','New York, USA'],l:'Fire Sign / Capitol / Elektra / CBS',
h:['Formada en Nueva York en 1975 por el guitarrista Mark Reale. Rock City (1977) y Narita (1979) tuvieron al cantante Guy Speranza; Fire Down Under (1981) fue su disco más vendido. Después cantó Rhett Forrester (Restless Breed, Born in America). En 1988 Thundersteel, con Tony Moore, aceleró el sonido hacia lo que luego se llamó power metal.','Formed in New York in 1975 by guitarist Mark Reale. Rock City (1977) and Narita (1979) featured singer Guy Speranza; Fire Down Under (1981) was their best-selling album. Rhett Forrester then sang (Restless Breed, Born in America). In 1988 Thundersteel, with Tony Moore, sped up the sound toward what was later called power metal.'],
m:[M('Mark Reale','guitarra y fundador','guitar and founder','† 2012'),M('Guy Speranza','voz (1975-81)','vocals (1975–81)','† 2003'),M('Rhett Forrester','voz (1981-84)','vocals (1981–84)','† 1994'),M('Tony Moore','voz (Thundersteel, 1988)','vocals (Thundersteel, 1988)'),M('Lou Kouvaris','guitarra (primera etapa)','guitar (first period)','† 2020')],
g:[['Narita (1979) les dio éxito en Japón y Europa.','Narita (1979) brought them success in Japan and Europe.'],['Fire Down Under (1981) fue su disco más vendido.','Fire Down Under (1981) was their best-selling album.'],['Thundersteel (1988) se cita como un antecedente del power metal.','Thundersteel (1988) is cited as a forerunner of power metal.']],
p:[['Capitol los dejó apenas terminó la gira con Sammy Hagar que promocionó Narita.','Capitol dropped them as soon as the Sammy Hagar tour that promoted Narita ended.'],['Guy Speranza dejó la banda por tener dificultades para conciliar sus convicciones religiosas con su rol.','Guy Speranza left because he struggled to reconcile his religious convictions with his role.'],['El comportamiento errático de Forrester en gira y un cambio de gestión en Elektra frenaron la proyección del grupo.','Forrester’s erratic behaviour on the road and a management change at Elektra held back the group’s momentum.']],
a:[['Narita (1979) toma su nombre del aeropuerto de Tokio.','Narita (1979) is named after Tokyo’s airport.'],['Tras la muerte de Reale, la banda siguió con el nombre Riot V.','After Reale’s death the band continued under the name Riot V.']],
f:['Rhett Forrester murió el 22 de enero de 1994, a los 37 años, a tiros en Atlanta, cuando se negó a entregar su auto en un intento de robo. Guy Speranza murió el 8 de noviembre de 2003 de cáncer de páncreas. Mark Reale murió en enero de 2012, a los 56 años. Lou Kouvaris murió en marzo de 2020, a los 66 años.','Rhett Forrester was shot and killed in Atlanta on 22 January 1994, aged 37, after refusing to hand over his car in an attempted carjacking. Guy Speranza died on 8 November 2003 of pancreatic cancer. Mark Reale died in January 2012, aged 56. Lou Kouvaris died in March 2020, aged 66.'],

{y:1975,n:'Saxon',c:['Barnsley, Reino Unido','Barnsley, United Kingdom'],l:'Carrere / EMI',
h:['Nació en Barnsley de la fusión de dos bandas locales, con Biff Byford como cantante, y se llamó al principio Son of a Bitch; con el contrato con Carrere pasó a llamarse Saxon porque el nombre original no servía para la radio. Con Saxon (1979), Wheels of Steel (1980), Strong Arm of the Law (1980) y Denim and Leather (1981) se convirtió en una de las bandas clave de la NWOBHM.','Born in Barnsley from the merger of two local bands, with Biff Byford as singer, it was first called Son of a Bitch; with the Carrere deal it became Saxon because the original name was unsuitable for radio. With Saxon (1979), Wheels of Steel (1980), Strong Arm of the Law (1980) and Denim and Leather (1981) it became one of the key NWOBHM bands.'],

g:[['Wheels of Steel (1980) y los discos siguientes llevaron a la banda a los primeros puestos de las listas del Reino Unido.','Wheels of Steel (1980) and the albums that followed took the band to the upper reaches of the UK charts.'],['Tocó en el primer festival Monsters of Rock en Castle Donington (1980).','It played the first Monsters of Rock festival at Castle Donington (1980).'],['Sigue publicando discos en pleno siglo XXI, como Carpe Diem (2022) y Hell, Fire and Damnation (2024).','It still releases albums well into the 21st century, such as Carpe Diem (2022) and Hell, Fire and Damnation (2024).']],
p:[['Pete Gill dejó la banda en 1981 por una lesión en la mano; lo reemplazó Nigel Glockler, que tuvo que aprender el repertorio en un día y medio.','Pete Gill left in 1981 after a hand injury; he was replaced by Nigel Glockler, who had to learn the set in a day and a half.'],['En 1983 dejaron Carrere por desacuerdos sobre las ventas; Steve Dawson salió en 1986 y Graham Oliver en 1995.','In 1983 they left Carrere over disagreements about sales; Steve Dawson left in 1986 and Graham Oliver in 1995.'],['Oliver y Dawson registraron el nombre «Saxon» e intentaron impedir que Byford lo usara; en febrero de 2003 la Alta Corte de Londres falló a favor de Byford, y ellos pasaron a llamarse Oliver/Dawson Saxon.','Oliver and Dawson registered the name “Saxon” and tried to stop Byford using it; in February 2003 London’s High Court ruled in Byford’s favour, and they became Oliver/Dawson Saxon.']],

{y:1976,n:'Accept',c:['Solingen, Alemania','Solingen, Germany'],l:'Brain / Portrait / RCA',
h:['Accept se formó en Solingen en 1976 alrededor de Udo Dirkschneider (voz) y Wolf Hoffmann (guitarra). Con Restless and Wild (1982) y Balls to the Wall (1983) fijaron el metal alemán, con voces rasgadas y riffs rápidos. Udo salió en 1987; la banda se separó en 1989, volvió en 1992 y se separó otra vez en 1997.','Accept formed in Solingen in 1976 around Udo Dirkschneider (vocals) and Wolf Hoffmann (guitar). With Restless and Wild (1982) and Balls to the Wall (1983) they set the template for German metal, with raspy vocals and fast riffs. Udo left in 1987; the band split in 1989, returned in 1992 and split again in 1997.'],
m:[M('Udo Dirkschneider','voz (1976-87, 1992-97, 2005)','vocals (1976–87, 1992–97, 2005)'),M('Wolf Hoffmann','guitarra y fundador','guitar and founder'),M('Peter Baltes','bajo (hasta 2018)','bass (until 2018)'),M('Jörg Fischer','guitarra','guitar'),M('Stefan Kaufmann','batería','drums'),M('Mark Tornillo','voz (desde 2009)','vocals (from 2009)')],
g:[['Restless and Wild (1982) y Balls to the Wall (1983) están entre los discos que más influyeron en el heavy y el speed metal alemanes.','Restless and Wild (1982) and Balls to the Wall (1983) are among the albums that most influenced German heavy and speed metal.'],['Con Mark Tornillo grabaron Blood of the Nations (2010), recibido como un regreso a su mejor forma.','With Mark Tornillo they recorded Blood of the Nations (2010), received as a return to their best form.']],
p:[['Udo salió en 1987: según algunos fue despedido; según Hoffmann fue una decisión de común acuerdo. Su primer disco solista, Animal House, lo compuso la gente de Accept.','Udo left in 1987: some say he was fired; according to Hoffmann it was a mutual decision. His first solo album, Animal House, was written by the Accept team.'],['Con el cantante estadounidense David Reece grabaron Eat the Heat (1989), que fracasó y llevó a la separación; el propio Hoffmann admitió que ese disco fue malo.','With American singer David Reece they recorded Eat the Heat (1989), which flopped and led to the split; Hoffmann himself admitted the album was bad.'],['Udo volvió en 1992 y el grupo grabó Objection Overruled (1993). En 2009 Hoffmann volvió a reunir a Accept sin Udo, que rechazó participar, y aún hay tensión entre ambos.','Udo returned in 1992 and the group recorded Objection Overruled (1993). In 2009 Hoffmann reunited Accept without Udo, who declined to take part, and tension between them persists.']],
a:[['Gaby Hauke, pareja y luego esposa de Hoffmann, firmaba letras con el seudónimo «Deaffy».','Gaby Hauke, Hoffmann’s partner and later wife, signed lyrics under the pseudonym “Deaffy”.'],['Udo formó U.D.O. y, desde los 2010, giró con el proyecto Dirkschneider tocando solo canciones de Accept.','Udo formed U.D.O. and, from the 2010s, toured with the Dirkschneider project playing only Accept songs.']],
f:['Pendiente: no tengo verificados fallecimientos de integrantes históricos de esta banda, por eso no los menciono.','Pending: I have no verified deaths of historic members of this band, so none are mentioned.'],
s:[['Wikipedia: Accept',W+'Accept_(band)'],['Louder: reseña de Objection Overruled','https://www.loudersound.com/reviews/accept-objection-overruled']]}

}

<script>
(function(){
var LGs=['es','en','de','fr','pt','it','ru','ja','zh','ko'];
function P(s){return s.split('|')}
var TXT={
 h:P('Ficha|Profile|Steckbrief|Fiche|Ficha|Scheda|Досье|プロフィール|档案|프로필'),

 no:P('Todavía no encontré una ficha de este músico en Wikipedia.|No Wikipedia profile found for this musician yet.|Noch kein Wikipedia-Eintrag für diesen Musiker gefunden.|Aucune fiche Wikipédia trouvée pour ce musicien.|Ainda não encontrei uma ficha deste músico na Wikipédia.|Nessuna scheda Wikipedia trovata per questo musicista.|Статья в Википедии об этом музыканте не найдена.|このミュージシャンのWikipedia記事は見つかりませんでした。|暂未找到该音乐人的维基百科条目。|이 뮤지션의 위키백과 문서를 찾지 못했습니다.'),

 b:P('Nació|Born|Geboren|Né(e)|Nasceu|Nato|Родился|生年月日|出生|출생'),
 d:P('Falleció|Died|Gestorben|Décédé(e)|Faleceu|Morto|Умер|没年月日|逝世|사망'),
 more:P('Vida completa en Wikipedia|Full biography on Wikipedia|Ganze Biografie auf Wikipedia|Biographie complète sur Wikipédia|Biografia completa na Wikipédia|Biografia completa su Wikipedia|Полная биография в Википедии|Wikipediaで全文を読む|在维基百科阅读完整传记|위키백과에서 전체 약력 보기'),
 ok:P('Integrante confirmado de|Confirmed member of|Bestätigtes Mitglied von|Membre confirmé de|Integrante confirmado de|Membro confermato di|Подтверждён участник|所属確認済み|已确认成员|확인된 멤버'),
