 sh:P('Mostrar igualmente|Show anyway|Trotzdem anzeigen|Afficher quand même|Mostrar mesmo assim|Mostra comunque|Всё равно показать|それでも表示|仍然显示|그래도 보기'),
 un:P('Sin confirmar: podría ser un homónimo.|Unconfirmed: could be a namesake.|Nicht bestätigt: könnte ein Namensvetter sein.|Non confirmé : peut-être un homonyme.|Não confirmado: pode ser um homônimo.|Non confermato: potrebbe essere un omonimo.|Не подтверждено: возможно, тёзка.|未確認:同名の別人の可能性があります。|未确认:可能是同名者。|확인되지 않음: 동명이인일 수 있습니다.'),

};
var HINT={es:'músico',en:'musician',de:'Musiker',fr:'musicien',pt:'músico',it:'musicista',ru:'музыкант',ja:'ミュージシャン',zh:'音乐人',ko:'뮤지션'};
function t(k){var i=(typeof LI==='number'&&LI>-1&&LI<10)?LI:0;return TXT[k][i]}
function lang(){var i=(typeof LI==='number'&&LI>-1&&LI<10)?LI:0;return LGs[i]}
var MUSR=/music|band|guitar|sing|vocal|drum|bass|keyboard|compos|músic|banda|guitarr|cantant|bater|bajist|teclist|musik|gitarr|sänger|schlagzeug|musicien|groupe|chant|guitariste|batteur|bassiste|musicist|chitarr|batterist|музыкант|гитарист|вокалист|барабан|ミュージシャン|ギタリスト|歌手|ドラマー|ベーシスト|音乐|音樂|吉他|鼓手|贝斯|음악|기타|가수|드럼/i;
function n2(x){return norm(x).replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[^a-z0-9]+/g,' ').trim()}
function wapi(host,p){var c=new AbortController(),to=setTimeout(function(){c.abort()},12000);
 return fetch('https://'+host+'/w/api.php?format=json&origin=*&'+p,{signal:c.signal}).then(function(r){if(!r.ok)throw new Error('http'+r.status);return r.json()}).finally(function(){clearTimeout(to)})}
function pgs(r){var o=(r&&r.query&&r.query.pages)||{};return Object.keys(o).map(function(k){return o[k]})}
function bandsOf(name){return BD.filter(function(b){return b.m.indexOf(name)>-1}).map(function(b){return b.n}).concat(oth(name,''))}

/* ===== Ficha estable y fiable (v2) =====
   Problema anterior: en cada idioma se buscaba el NOMBRE en esa Wikipedia y se aceptaba el primer resultado que "sonara a músico".
   Con homónimos (p. ej. varios «Brian Johnson») cada idioma podía devolver una persona distinta.
   Ahora: 1) cada músico se resuelve UNA sola vez a un ítem de Wikidata (Q…), validado con sus bandas del directorio y comprobando que es una persona;
          2) en cualquier idioma se muestra el artículo de ESE mismo ítem (enlaces entre idiomas de Wikidata), nunca una búsqueda por nombre;
          3) fechas, lugar, descripción y nombre local salen del mismo ítem, así que coinciden en los 10 idiomas;
          4) si ese idioma no tiene artículo, se usa el inglés del mismo ítem y se marca (EN). */
var FIXQ={'brian johnson':'Q295948'};   /* correcciones manuales verificadas: nombre normalizado → ítem de Wikidata */
var QK='rmq3|';
function hasParen(x){return x.indexOf('(')>-1}

/* Candidatos: busca «nombre + banda», «nombre + músico» y «nombre» a secas, y puntúa.
   - Las bandas que se llaman igual que el músico (proyectos solistas, p. ej. «Al Di Meola») NO cuentan como prueba de identidad.
   - Un artículo cuyo título no es el nombre del músico solo se acepta si Wikidata lo reconoce con ese nombre (etiqueta o alias). */
async function cands(lg,name,bands){
 var want=n2(name),own=bands.filter(function(b){return n2(b)!==want}),bn=own.map(norm),qs=[];
 own.slice(0,2).forEach(function(b){qs.push(name+' '+b)});
 qs.push(name+' '+HINT[lg]);qs.push(name);
 var rs=await Promise.all(qs.map(function(q){return wapi(lg+'.wikipedia.org','action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=10&prop=extracts|pageprops&exintro=1&explaintext=1&exsentences=8&exlimit=10&ppprop=disambiguation|wikibase_item').catch(function(){return null})}));
 if(rs.every(function(r){return r===null}))throw new Error('net');
 var seen={},L=[];
 rs.forEach(function(r){pgs(r).sort(function(x,y){return x.index-y.index}).forEach(function(p){if(seen[p.pageid])return;seen[p.pageid]=1;L.push(p)})});
 var out=[];
 L.forEach(function(p,i){var pp=p.pageprops||{};if(pp.disambiguation!==undefined||!pp.wikibase_item)return;
  var ex=p.extract||'',nex=norm(ex);if(!MUSR.test(ex))return;
  var isT=!!want&&n2(p.title)===want,h=bn.filter(function(b){return b.length>2&&nex.indexOf(b)>-1}).length,s=0;
  if(isT)s=h?100+h*10+(hasParen(p.title)?0:5):0;
  else if(h)s=60+h;
  out.push({q:pp.wikibase_item,s:s,i:i,t:isT,pl:!hasParen(p.title)})});
 var T=out.filter(function(o){return o.t&&!o.s}),anyBand=out.some(function(o){return o.s>0&&o.t});
 if(!anyBand){if(out.filter(function(o){return o.t}).length===1)T.forEach(function(o){o.s=20});else T.forEach(function(o){if(o.pl)o.s=30})}
 return out.filter(function(o){return o.s>0||o.t}).sort(function(x,y){return y.s-x.s||x.i-y.i}).slice(0,8)}

/* Bandas de las que Wikidata dice que la persona es miembro (P463), con sus nombres en inglés */
async function memLabels(ents){
 var ids=[],byE=[],lab={};
 ents.forEach(function(e){var l=[];(((e||{}).claims||{}).P463||[]).slice(0,14).forEach(function(x){var v=x.mainsnak&&x.mainsnak.datavalue&&x.mainsnak.datavalue.value;if(v&&v.id){l.push(v.id);if(ids.indexOf(v.id)<0)ids.push(v.id)}});byE.push(l)});
 for(var i=0;i<ids.length;i+=40){
  var r=await wapi('www.wikidata.org','action=wbgetentities&ids='+ids.slice(i,i+40).join('|')+'&props=labels|aliases&languages=en'),E=r.entities||{};
  Object.keys(E).forEach(function(k){var v=[],x=E[k]||{};if(x.labels&&x.labels.en)v.push(x.labels.en.value);((x.aliases||{}).en||[]).forEach(function(a){v.push(a.value)});lab[k]=v})}
 return byE.map(function(l){var o=[];l.forEach(function(id){(lab[id]||[]).forEach(function(v){o.push(v)})});return o})}
function bandMatch(labs,bands,want){
 var m='';
 bands.forEach(function(b){if(m)return;var nb=n2(b).replace(/^the /,'');if(!nb||nb===want)return;
  if(labs.some(function(l){return n2(l).replace(/^the /,'')===nb}))m=b});
 return m}
function nameEq(e,want){var v=[];Object.keys(e.labels||{}).forEach(function(k){v.push(e.labels[k].value)});
 Object.keys(e.aliases||{}).forEach(function(k){(e.aliases[k]||[]).forEach(function(a){v.push(a.value)})});
 return v.some(function(x){return n2(x)===want})}

/* Wikidata decide: persona (P31 = Q5), nombre reconocido y, sobre todo, miembro de una de SUS bandas (P463) */
async function pickQ(lg,name,bands){
 var cs=await cands(lg,name,bands);if(!cs.length)return '';
 var ids=cs.map(function(c){return c.q}),want=n2(name),ls=lg==='en'?'en':'en|'+lg;
 var r=await wapi('www.wikidata.org','action=wbgetentities&ids='+ids.join('|')+'&props=claims|labels|aliases&languages='+ls),E=r.entities||{};
 var ents=cs.map(function(c){return E[c.q]||{}}),labs;
 try{labs=await memLabels(ents)}catch(e){labs=cs.map(function(){return []})}
 var good=[];
 cs.forEach(function(c,i){var e=ents[i],p31=(e.claims||{}).P31;
  var human=!p31||p31.some(function(x){var v=x.mainsnak&&x.mainsnak.datavalue&&x.mainsnak.datavalue.value;return v&&v.id==='Q5'});
  if(!human)return;
  if(!c.t&&!nameEq(e,want))return;
  good.push({q:c.q,s:c.s,m:bandMatch(labs[i],bands,want)?1:0,i:i})});
 var best=good.filter(function(g){return g.m}).concat(good.filter(function(g){return !g.m&&g.s>0}))[0];
 return best?best.q:''}

/* Identidad independiente del idioma, guardada en el dispositivo. Se busca primero en inglés (los nombres de bandas del directorio están en inglés). */
async function resolveQ(name,bands){
 var fx=FIXQ[n2(name)];if(fx)return fx;
 var k=QK+norm(name);
 try{var c=localStorage.getItem(k);if(c)return c}catch(e){}
 var langs=lang()==='en'?['en']:['en',lang()],failed=0;
 for(var i=0;i<langs.length;i++){
  try{var q=await pickQ(langs[i],name,bands);if(q){try{localStorage.setItem(k,q)}catch(e){}return q}}catch(e){failed++}}
 if(failed===langs.length)throw new Error('off');
 return ''}

/* Texto + foto del artículo exacto (por título, no por búsqueda) */
async function wpage(lg,title){
 var r=await wapi(lg+'.wikipedia.org','action=query&redirects=1&titles='+encodeURIComponent(title)+'&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=5&piprop=thumbnail&pithumbsize=360&pilicense=free'),p=pgs(r)[0];
 return p&&p.missing===undefined?{t:p.title,x:p.extract||'',i:(p.thumbnail&&p.thumbnail.source)||''}:null}

/* Datos del ítem de Wikidata: descripción, nombre en el idioma, nacimiento (fecha y lugar), fallecimiento, imagen de Commons */
async function facts(e,lg){
 var c=e.claims||{};
 function dv(p){var s=c[p]&&c[p][0]&&c[p][0].mainsnak&&c[p][0].mainsnak.datavalue;return s&&s.value}
 var bt=dv('P569'),dt=dv('P570'),pl=dv('P19'),im=dv('P18'),d=e.descriptions||{},lb=e.labels||{},place='';
 if(pl&&pl.id){try{var pr=await wapi('www.wikidata.org','action=wbgetentities&ids='+pl.id+'&props=labels&languages='+lg+'|en'),pb=((pr.entities||{})[pl.id]||{}).labels||{};place=(pb[lg]||pb.en||{}).value||''}catch(x){}}
 return{b:bt&&bt.time||'',d:dt&&dt.time||'',p:place,s:(d[lg]||d.en||{}).value||'',n:(lb[lg]||{}).value||'',
  im:typeof im==='string'?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(im)+'?width=360':''}}

async function profile(q,lg,bands,name){
 var w=lg+'wiki',r=await wapi('www.wikidata.org','action=wbgetentities&ids='+q+'&props=claims|descriptions|labels|sitelinks&languages='+lg+'|en&sitefilter='+w+'|enwiki'),e=(r.entities||{})[q];
 if(!e||e.missing!==undefined)return null;
 var sl=e.sitelinks||{},use=sl[w]?lg:(sl.enwiki?'en':''),f={},pg=null;
 try{f=await facts(e,lg)}catch(x){}
 if(use){try{pg=await wpage(use,sl[use+'wiki'].title)}catch(x){}}
 var ex=(pg&&pg.x)||'';if(!ex&&!f.s)return null;
 var img=(pg&&pg.i)||'';
 if(!img&&use&&use!=='en'&&sl.enwiki){try{var p2=await wpage('en',sl.enwiki.title);img=(p2&&p2.i)||''}catch(x){}}
 if(!img)img=f.im||'';
 var ttl=(pg&&pg.t)||(use?sl[use+'wiki'].title:''),want=n2(name),v='';
 /* Verificación: ¿es integrante de alguna de las bandas indicadas? (1) ajuste manual, (2) Wikidata P463, (3) el texto del artículo nombra a la banda, (4) proyecto solista con su mismo nombre */
 if(Object.keys(FIXQ).some(function(k){return FIXQ[k]===q}))v=bands[0]||name;
 if(!v){try{var ml=await memLabels([e]);v=bandMatch(ml[0],bands,want)}catch(x){}}
 if(!v){var tx=ex;if(use&&use!=='en'&&sl.enwiki){try{var p3=await wpage('en',sl.enwiki.title);tx+=' '+((p3&&p3.x)||'')}catch(x){}}
  var ntx=norm(tx);bands.forEach(function(b){if(!v&&n2(b)!==want&&b.length>2&&ntx.indexOf(norm(b))>-1)v=b})}
 if(!v&&bands.some(function(b){return n2(b)===want})&&nameEq(e,want))v=name;
 return{v:v,q:q,t:ttl,x:ex||f.s,i:img,f:f,l:use||'en',u:use?'https://'+use+'.wikipedia.org/wiki/'+encodeURIComponent(ttl.replace(/ /g,'_')):'https://www.wikidata.org/wiki/'+q}}

function fd(s){var m=/^\+(\d+)-(\d\d)-(\d\d)/.exec(s||'');if(!m)return'';var y=+m[1],mo=+m[2],da=+m[3];if(!mo||!da)return String(y);
 try{return new Date(Date.UTC(y,mo-1,da)).toLocaleDateString(lang(),{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'})}catch(e){return y+'-'+m[2]+'-'+m[3]}}

function draw(el,res,state){
 el.classList.remove('ld');
 if(!res){el.innerHTML='<div class="fb"><div class="fk">'+t('h')+'</div><p class="ft">'+esc(t(state==='off'?'off':'no'))+'</p></div>';return}
 if(!res.v&&!el.dataset.force){
  el.innerHTML='<div class="fb"><div class="fk">'+t('h')+'</div><p class="ft">'+esc(t('nv').replace('%b',el.dataset.b||el.dataset.n))+'</p><p class="fs"><button type="button" class="lk" data-sh="1">'+esc(t('sh'))+'</button></p></div>';
  el.querySelector('[data-sh]').onclick=function(){el.dataset.force='1';draw(el,res)};return}
 var f=res.f||{},h=(res.i?'<img src="'+esc(res.i)+'" alt="'+esc(el.dataset.n)+'" loading="lazy" referrerpolicy="no-referrer">':'')+'<div class="fb"><div class="fk">'+t('h')+'</div>';
 var top=[f.n&&norm(f.n)!==norm(el.dataset.n)?f.n:'',f.s&&f.s!==res.x?f.s:''].filter(Boolean).join(' · ');
 if(top)h+='<p class="fd">'+esc(top)+'</p>';
 h+=res.x.split(/\n+/).filter(Boolean).map(function(s){return '<p class="ft">'+esc(s)+'</p>'}).join('');
 var b=fd(f.b),d=fd(f.d);
 if(b)h+='<p class="ff"><b>'+t('b')+':</b> '+esc(b)+(f.p?' · '+esc(f.p):'')+'</p>';
 if(d)h+='<p class="ff"><b>'+t('d')+':</b> '+esc(d)+' †</p>';
 h+=res.v?'<p class="ff"><b>✓ '+t('ok')+':</b> '+esc(res.v)+'</p>':'<p class="ff">⚠ '+esc(t('un'))+'</p>';
 h+='<p class="fs"><a href="'+esc(res.u)+'" target="_blank" rel="noopener">'+t('more')+'</a> · '+t('src')+': Wikipedia'+(res.l==='en'&&lang()!=='en'?' (EN)':'')+(res.q?' · <a href="https://www.wikidata.org/wiki/'+esc(res.q)+'" target="_blank" rel="noopener">Wikidata</a>':'')+'</p></div>';
 el.innerHTML=h}

async function loadFicha(name){
 var lg=lang(),key='rmf3|'+lg+'|'+norm(name),res=null,off=false,bands=bandsOf(name),fx=FIXQ[n2(name)];
 try{var c=localStorage.getItem(key);if(c){res=JSON.parse(c);if(!res||!res.q||(fx&&res.q!==fx))res=null}}catch(e){res=null}
 if(!res){
  try{var q=await resolveQ(name,bands);
   if(q){res=await profile(q,lg,bands,name);if(res){try{localStorage.setItem(key,JSON.stringify(res))}catch(e){}}}}
  catch(e){off=true;res=null}}
 var el=document.getElementById('fm');
 if(!el||el.dataset.n!==name)return;      /* el usuario ya cambió de vista */
 el.dataset.b=bands.slice(0,3).join(', ');
 draw(el,res,off?'off':'no')}

var _open=openNx;
openNx=function(tp,v){
 _open(tp,v);
 if(tp!=='m')return;
 var n=document.getElementById('nx'),p=n&&n.querySelector('h2+p');if(!p)return;
 p.insertAdjacentHTML('afterend','<div id="fm" class="fm ld" data-n="'+esc(v)+'"><div class="fb"><div class="fk">'+t('h')+'</div><p class="ft">'+t('ld')+'</p></div></div>');
 loadFicha(v)};
})();
